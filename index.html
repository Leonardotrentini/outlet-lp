<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0C0C0C">
  <title>WK Multimarcas — Outlet</title>
  <style>
    :root {
      --gold: #C8922A;
      --gold-light: #E8B84B;
      --dark: #0C0C0C;
      --off-white: #F2EDE4;
      --muted: #888880;
      --border: rgba(200, 146, 42, 0.22);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--dark);
      color: var(--off-white);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    h1 {
      font-size: clamp(1.35rem, 4vw, 1.85rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 28rem;
      line-height: 1.55;
      margin-bottom: 2rem;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
    a {
      display: inline-block;
      padding: 0.9rem 1.5rem;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    a.primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--dark);
      border-color: transparent;
    }
    a.primary:hover {
      filter: brightness(1.06);
    }
    a.ghost {
      color: var(--gold-light);
      background: rgba(200, 146, 42, 0.08);
    }
    a.ghost:hover {
      background: rgba(200, 146, 42, 0.15);
      border-color: rgba(200, 146, 42, 0.35);
    }
    footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <h1>WK Multimarcas — Outlet</h1>
  <p>Escolha a página para campanha ou teste. URLs limpas para anúncios: <strong>/grupos</strong> e <strong>/vendedores</strong>.</p>
  <nav class="links" aria-label="Páginas">
    <a class="primary" href="/grupos">Grupo VIP</a>
    <a class="ghost" href="/vendedores">Catálogo (vendedores)</a>
  </nav>
  <footer>Landing estática · Vercel</footer>
</body>
</html>
